name: Sprung
options:
  bundleIdPrefix: nrw.neuhaus
  developmentLanguage: de
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    DEVELOPMENT_TEAM: 273X2BW9X7
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  KeyboardEngine:
    path: Packages/KeyboardEngine
  ConnectionStore:
    path: Packages/ConnectionStore

settingGroups:
  freerdpLink:
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/vendor/install/lib
    OTHER_LDFLAGS:
      - -lfreerdp-client3
      - -lfreerdp3
      - -lwinpr3
      - -lssl
      - -lcrypto
      - -lcups # printer redirection (system CUPS)
      - -framework AudioToolbox
      - -framework AVFoundation
      - -framework Carbon
      - -framework CoreAudio
      - -framework CoreServices
      - -framework IOKit
      - -framework Security

targets:
  SprungBridge:
    type: library.static
    platform: macOS
    sources:
      - Sources/SprungBridge
    settings:
      base:
        SYSTEM_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/vendor/install/include/freerdp3
          - $(SRCROOT)/vendor/install/include/winpr3
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/SprungBridge/include
        GCC_C_LANGUAGE_STANDARD: gnu17
        GCC_WARN_UNUSED_PARAMETER: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        SKIP_INSTALL: YES

  SprungKit:
    type: library.static
    platform: macOS
    sources:
      - Sources/SprungKit
    dependencies:
      - target: SprungBridge
    settings:
      base:
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: NO

  Sprung:
    type: application
    platform: macOS
    sources:
      - Sources/Sprung
    dependencies:
      - target: SprungKit
      - target: SprungBridge
      - package: KeyboardEngine
        product: KeyboardEngine
      - package: ConnectionStore
        product: ConnectionStore
    scheme:
      testTargets: [SprungTests]
    settings:
      groups: [freerdpLink]
      base:
        PRODUCT_NAME: Sprung
        # Document type for .rdp files; the generated Info.plist keys are merged into it.
        INFOPLIST_FILE: Sources/Sprung/Support/Info.plist
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Leitet das Mikrofon an den entfernten Windows-PC weiter, wenn die Verbindung das erlaubt."
        CODE_SIGN_ENTITLEMENTS: Sources/Sprung/Support/Sprung.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.sprung
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sprung
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Apache-2.0"

  sprung-smoke:
    type: tool
    platform: macOS
    sources:
      - Sources/SprungSmoke
    dependencies:
      - target: SprungKit
      - target: SprungBridge
    scheme: {}
    settings:
      groups: [freerdpLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.sprung.smoke

  # Keyboard and clipboard end-to-end test against the VM (scripts/e2e.sh).
  sprung-e2e:
    type: tool
    platform: macOS
    sources:
      - Sources/SprungE2E
      - Sources/SprungSmoke/SmokeProbe.swift
      - Sources/SprungSmoke/FramebufferSnapshot.swift
      - Sources/Sprung/Input/RemoteKeyboard+Actions.swift
    dependencies:
      - target: SprungKit
      - target: SprungBridge
      - package: KeyboardEngine
        product: KeyboardEngine
    scheme: {}
    settings:
      groups: [freerdpLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.sprung.e2e

  # Pure logic of the app, compiled in directly so the tests need no app host.
  SprungTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SprungTests
      - Sources/Sprung/Session/DesktopGeometry.swift
      - Sources/Sprung/Session/ScrollAccumulator.swift
      - Sources/Sprung/Session/RemoteCursors.swift
      - Sources/Sprung/Input/SystemShortcutTap.swift
      - Sources/Sprung/Model
    dependencies:
      - target: SprungKit
      - target: SprungBridge
      - package: KeyboardEngine
        product: KeyboardEngine
      - package: ConnectionStore
        product: ConnectionStore
    settings:
      groups: [freerdpLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.sprung.tests
        GENERATE_INFOPLIST_FILE: YES
