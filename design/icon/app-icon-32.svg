<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Small-size variant of app-icon.svg, drawn on the 32 px grid: the 32 px renders (16 pt @2x,
       32 pt @1x) stay crisp with a thicker title bar, larger lights and two ridges instead of four. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16405c"/><stop offset="1" stop-color="#061420"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e9fb3"/><stop offset="0.7" stop-color="#7fd6c4"/><stop offset="1" stop-color="#d8f2e4"/></linearGradient>
    <clipPath id="window"><rect x="7" y="8" width="18" height="16" rx="2"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="3" y="3" width="26" height="26" rx="6" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#window)">
    <rect x="7" y="8" width="18" height="16" fill="url(#sky)"/>
    <circle cx="20" cy="17" r="2.2" fill="#fffbe6"/>
    <path d="M7 19 L11 16 L14 18 L18 15 L21 18 L25 16 V24 H7 Z" fill="#2a8a8c"/>
    <path d="M7 22 L12 19 L17 22 L21 20 L25 21 V24 H7 Z" fill="#07323d"/>
    <rect x="7" y="8" width="18" height="4" fill="#eefaf6"/>
    <circle cx="10" cy="10" r="1.05" fill="#ff6159"/><circle cx="13" cy="10" r="1.05" fill="#ffbd2e"/><circle cx="16" cy="10" r="1.05" fill="#28c941"/>
  </g>
</svg>
